map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream spring_app {
    server spring-app:8080;
    keepalive 32;
}

# 요청 속도 제한
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name fridgely.cloud www.fridgely.cloud;

    # Certbot 인증 (자동 갱신용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 보안 헤더 (SSL은 LB에서 처리)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # /actuator/health - VCN 내부에서만 허용
    location = /actuator/health {
        allow 10.0.0.0/24;
        deny all;
        proxy_pass http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 나머지 /actuator/* 전체 차단
    location ~ ^/actuator {
        deny all;
    }

    # Swagger - Basic Auth 인증 필요
    location ~* ^/(swagger-ui(\.html)?|v3/api-docs)(/|$) {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # /grafana 끝 슬래시 없이 접속 시 리다이렉트
    location = /grafana {
        return 301 https://$host/grafana/;
    }

    # Grafana 프록시
    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect http://grafana:3000/ https://$host/grafana/;

        # Grafana Live 웹소켓 지원
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # API 요청 프록시
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://spring_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_set_header X-Request-ID      $request_id;

        # 타임아웃
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 응답 버퍼
        proxy_buffer_size          16k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;
    }
}
