map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

map $forwarded_proto $hsts_header {
    "https"  "max-age=31536000; includeSubDomains";
    default  "";
}

upstream spring_app {
    server spring-app:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m      rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=reissue_limit:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;

server {
    listen 80;
    server_name fridgely.cloud www.fridgely.cloud;

    limit_req_status 429;

    set_real_ip_from  10.0.0.0/24;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security $hsts_header;

    location = /actuator/health {
        allow 10.0.0.0/24;
        deny all;
        proxy_pass http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/actuator {
        deny all;
    }

    location ~* ^/(swagger-ui(\.html)?|v3/api-docs)(/|$) {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /grafana {
        return 301 https://$host/grafana/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect http://grafana:3000/ https://$host/grafana/;

        # Grafana Live 웹소켓 지원
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /api/v1/auth/login {
        limit_req zone=api_limit   burst=10 nodelay;
        limit_req zone=login_limit burst=3  nodelay;

        proxy_pass http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffer_size          16k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;
    }

    location = /api/v1/auth/reissue {
        limit_req zone=api_limit     burst=10 nodelay;
        limit_req zone=reissue_limit burst=3  nodelay;

        proxy_pass http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffer_size          16k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;
    }

    location = /api/v1/members {
        limit_req zone=api_limit      burst=10 nodelay;
        limit_req zone=register_limit burst=2  nodelay;

        proxy_pass http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffer_size          16k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;
    }

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://spring_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffer_size          16k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;
    }
}
