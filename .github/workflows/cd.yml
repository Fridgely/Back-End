name: Fridgely CD Pipeline

'on':
  workflow_run:
    workflows: ["Fridgely CI Pipeline"]
    branches: ["master"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: JAR 빌드
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: JAR 빌드
        run: ./gradlew bootJar -x test

      - name: JAR 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/fridgely.jar
          retention-days: 1

  deploy-main:
    name: Main 서버 배포
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      - name: LB Main 백엔드 drain
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        with:
          command: >-
            lb backend update
            --load-balancer-id ${{ secrets.LB_OCID }}
            --backend-set-name ${{ secrets.LB_BACKEND_SET }}
            --backend-name ${{ secrets.LB_BACKEND_MAIN }}
            --weight 1 --drain true --backup false --offline false
            --wait-for-state SUCCEEDED --max-wait-seconds 120
          silent: false

      - name: 기존 연결 drain 대기 (30s)
        run: sleep 30

      - name: 현재 JAR 백업 (Main)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_MAIN }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/fridgely-project
            [ -f fridgely.jar ] && cp fridgely.jar fridgely.jar.bak || true

      - name: JAR 전송 (Main)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.HOST_MAIN }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "fridgely.jar"
          target: "/home/${{ secrets.USERNAME }}/fridgely-project/"

      - name: 배포 및 헬스체크 (Main)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_MAIN }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/fridgely-project

            git fetch origin master

            # exit code 기반 nginx.conf 변경 감지 (0=변경없음, 1=변경있음, >1=git 오류)
            git diff --quiet HEAD origin/master -- nginx/nginx.conf; NGINX_CHANGED=$?
            if [ "$NGINX_CHANGED" -gt 1 ]; then
              echo "오류: nginx.conf 변경 감지 중 git diff 실패 (exit code: $NGINX_CHANGED)"
              exit 1
            fi

            git reset --hard origin/master
            git clean -fd -e .env -e .env.local -e fridgely.jar

            docker compose up -d --no-build --force-recreate --wait app

            if [ "$NGINX_CHANGED" -eq 1 ]; then
              echo "nginx 설정 변경 감지 → nginx 컨테이너 재생성"
              docker compose up -d --force-recreate nginx
            else
              echo "nginx 설정 변경 없음 → reload만 수행"
              docker exec nginx nginx -s reload
            fi

      - name: LB Main 백엔드 복구
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        with:
          command: >-
            lb backend update
            --load-balancer-id ${{ secrets.LB_OCID }}
            --backend-set-name ${{ secrets.LB_BACKEND_SET }}
            --backend-name ${{ secrets.LB_BACKEND_MAIN }}
            --weight 1 --drain false --backup false --offline false

      - name: 배포 실패 시 이전 버전 롤백 (Main)
        if: failure()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_MAIN }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/fridgely-project
            if [ -f fridgely.jar.bak ]; then
              cp fridgely.jar.bak fridgely.jar
              docker compose up -d --no-build --force-recreate app
              echo "이전 버전으로 롤백 완료"
            else
              echo "백업 파일 없음 — 롤백 불가"
            fi

      - name: LB Main 백엔드 복구 (롤백 후)
        if: failure()
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        with:
          command: >-
            lb backend update
            --load-balancer-id ${{ secrets.LB_OCID }}
            --backend-set-name ${{ secrets.LB_BACKEND_SET }}
            --backend-name ${{ secrets.LB_BACKEND_MAIN }}
            --weight 1 --drain false --backup false --offline false

  deploy-sub:
    name: Sub 서버 배포
    needs: deploy-main
    runs-on: ubuntu-latest

    steps:
      - name: Compose 파일 체크아웃 (sparse)
        uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: |
            docker-compose.sub.yml
            nginx/nginx.sub.conf
          sparse-checkout-cone-mode: false

      - name: JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      - name: LB Sub 백엔드 drain
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        with:
          command: >-
            lb backend update
            --load-balancer-id ${{ secrets.LB_OCID }}
            --backend-set-name ${{ secrets.LB_BACKEND_SET }}
            --backend-name ${{ secrets.LB_BACKEND_SUB }}
            --weight 1 --drain true --backup false --offline false
            --wait-for-state SUCCEEDED --max-wait-seconds 120

      - name: 기존 연결 drain 대기 (30s)
        run: sleep 30

      - name: 현재 JAR 백업 (Sub)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_SUB }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/fridgely-project
            [ -f fridgely.jar ] && cp fridgely.jar fridgely.jar.bak || true

      - name: JAR + Compose 파일 전송 (Sub)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.HOST_SUB }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "fridgely.jar,docker-compose.sub.yml,nginx/nginx.sub.conf"
          target: "/home/${{ secrets.USERNAME }}/fridgely-project/"

      - name: 배포 및 헬스체크 (Sub)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_SUB }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.USERNAME }}/fridgely-project/logs
            mkdir -p /home/${{ secrets.USERNAME }}/fridgely-project/nginx
            cd /home/${{ secrets.USERNAME }}/fridgely-project
            docker compose -f docker-compose.sub.yml up -d --no-build --force-recreate --wait
            curl -fsSL --retry 5 --retry-delay 5 http://127.0.0.1:8080/actuator/health

      - name: LB Sub 백엔드 복구
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        with:
          command: >-
            lb backend update
            --load-balancer-id ${{ secrets.LB_OCID }}
            --backend-set-name ${{ secrets.LB_BACKEND_SET }}
            --backend-name ${{ secrets.LB_BACKEND_SUB }}
            --weight 1 --drain false --backup false --offline false

      - name: 배포 실패 시 이전 버전 롤백 (Sub)
        if: failure()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_SUB }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/fridgely-project
            if [ -f fridgely.jar.bak ]; then
              cp fridgely.jar.bak fridgely.jar
              docker compose -f docker-compose.sub.yml up -d --no-build --force-recreate app
              echo "이전 버전으로 롤백 완료"
            else
              echo "백업 파일 없음 — 롤백 불가"
            fi

      - name: LB Sub 백엔드 복구 (롤백 후)
        if: failure()
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        with:
          command: >-
            lb backend update
            --load-balancer-id ${{ secrets.LB_OCID }}
            --backend-set-name ${{ secrets.LB_BACKEND_SET }}
            --backend-name ${{ secrets.LB_BACKEND_SUB }}
            --weight 1 --drain false --backup false --offline false