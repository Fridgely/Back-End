---
name: Fridgely CD Pipeline

'on':
  workflow_run:
    workflows: ["Fridgely CI Pipeline"]
    branches: ["master"]
    types: [completed]

jobs:
  build:
    name: JAR 빌드
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: JAR 빌드
        run: ./gradlew bootJar -x test

      - name: JAR 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/fridgely.jar
          retention-days: 1

  deploy-main:
    name: Main 서버 배포
    needs: build
    runs-on: ubuntu-latest
    # NOTE: LB drain 활성화 전까지 재기동 중 순단 발생 가능 — 아래 TODO 참조

    steps:
      - name: JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      # TODO: Load Balancer — Main drain 처리 (LB 생성 후 활성화)
      # oci lb backend update \
      #   --load-balancer-id ${{ secrets.LB_OCID }} \
      #   --backend-set-name ${{ secrets.LB_BACKEND_SET }} \
      #   --backend-name "${{ secrets.LB_BACKEND_MAIN }}" \
      #   --weight 0 --drain true

      - name: JAR 전송 (Main)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.HOST_MAIN }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "fridgely.jar"
          target: "/home/${{ secrets.USERNAME }}/fridgely-project/"

      - name: 배포 및 헬스체크 (Main)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_MAIN }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/fridgely-project

            git fetch origin master

            # exit code 기반 nginx.conf 변경 감지 (0=변경없음, 1=변경있음, >1=git 오류)
            git diff --quiet HEAD origin/master -- nginx/nginx.conf; NGINX_CHANGED=$?
            if [ "$NGINX_CHANGED" -gt 1 ]; then
              echo "오류: nginx.conf 변경 감지 중 git diff 실패 (exit code: $NGINX_CHANGED)"
              exit 1
            fi

            git reset --hard origin/master
            git clean -fd -e .env -e .env.local -e fridgely.jar

            docker compose up -d --no-build --force-recreate --wait app

            if [ "$NGINX_CHANGED" -eq 1 ]; then
              echo "nginx 설정 변경 감지 → nginx 컨테이너 재생성"
              docker compose up -d --force-recreate nginx
            else
              echo "nginx 설정 변경 없음 → reload만 수행"
              docker exec nginx nginx -s reload
            fi

      # TODO: Load Balancer — Main 복구 (LB 생성 후 활성화)
      # oci lb backend update \
      #   --load-balancer-id ${{ secrets.LB_OCID }} \
      #   --backend-set-name ${{ secrets.LB_BACKEND_SET }} \
      #   --backend-name "${{ secrets.LB_BACKEND_MAIN }}" \
      #   --weight 1 --drain false

  deploy-sub:
    name: Sub 서버 배포
    needs: deploy-main
    runs-on: ubuntu-latest
    # NOTE: LB drain 활성화 전까지 재기동 중 순단 발생 가능 — 아래 TODO 참조

    steps:
      - name: Compose 파일 체크아웃 (sparse)
        uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: docker-compose.sub.yml
          sparse-checkout-cone-mode: false

      - name: JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      # TODO: Load Balancer — Sub drain 처리 (LB 생성 후 활성화)
      # oci lb backend update \
      #   --load-balancer-id ${{ secrets.LB_OCID }} \
      #   --backend-set-name ${{ secrets.LB_BACKEND_SET }} \
      #   --backend-name "${{ secrets.LB_BACKEND_SUB }}" \
      #   --weight 0 --drain true

      - name: 현재 JAR 백업 (Sub)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_SUB }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/fridgely-project
            [ -f fridgely.jar ] && cp fridgely.jar fridgely.jar.bak || true

      - name: JAR + Compose 파일 전송 (Sub)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.HOST_SUB }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "fridgely.jar,docker-compose.sub.yml"
          target: "/home/${{ secrets.USERNAME }}/fridgely-project/"

      - name: 배포 및 헬스체크 (Sub)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_SUB }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.USERNAME }}/fridgely-project/logs
            cd /home/${{ secrets.USERNAME }}/fridgely-project
            docker compose -f docker-compose.sub.yml up -d --no-build --force-recreate --wait app

      - name: 배포 실패 시 이전 버전 롤백 (Sub)
        if: failure()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST_SUB }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/fridgely-project
            if [ -f fridgely.jar.bak ]; then
              cp fridgely.jar.bak fridgely.jar
              docker compose -f docker-compose.sub.yml up -d --no-build --force-recreate app
              echo "이전 버전으로 롤백 완료"
            else
              echo "백업 파일 없음 — 롤백 불가"
            fi

      # TODO: Load Balancer — Sub 복구 (LB 생성 후 활성화)
      # oci lb backend update \
      #   --load-balancer-id ${{ secrets.LB_OCID }} \
      #   --backend-set-name ${{ secrets.LB_BACKEND_SET }} \
      #   --backend-name "${{ secrets.LB_BACKEND_SUB }}" \
      #   --weight 1 --drain false
