services:
  app:
    image: eclipse-temurin:17-jre-jammy
    container_name: spring-app
    restart: always
    working_dir: /app
    volumes:
      - ./fridgely.jar:/app/fridgely.jar
      - ./logs:/app/logs
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:?JAVA_TOOL_OPTIONS is required}
      - TZ=${TZ:-Asia/Seoul}
      - DB_HOST=${DB_HOST:?DB_HOST is required}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:?SLACK_WEBHOOK_URL is required}
      - FCM_BASE64_KEY=${FCM_BASE64_KEY:?FCM_BASE64_KEY is required}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:?AWS_ACCESS_KEY is required}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:?AWS_SECRET_KEY is required}
      - S3_BUCKET=${S3_BUCKET:?S3_BUCKET is required}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: ["java", "-jar", "fridgely.jar"]

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.sub.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
