# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"

reviews:
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_instructions:

    # ──────────────────────────────────────────
    # 전체 Java 공통 규칙
    # ──────────────────────────────────────────
    - path: "src/main/java/**/*.java"
      instructions: |
        ## 예외 처리
        - 비즈니스 예외는 반드시 `CoreException(ErrorType.XXX)` 를 사용한다.
        - `IllegalArgumentException`, `RuntimeException` 직접 throw 는 금지다.
        - `ErrorType` LogLevel 기준: 시스템 오류 → ERROR, 클라이언트 입력/비즈니스 위반 → INFO, 인증/권한 → WARN.

        ## 로깅
        - 형식: `[Domain] 메시지. (key=value)` — 예: `log.info("[Category] 카테고리 생성. (refrigeratorId={})", id)`
        - 중요 이벤트에는 SlackMarkers 사용: `SYSTEM`(보안/데이터 이상), `BATCH`(배치 결과), `BUSINESS`(주요 비즈니스 이벤트).

        ## 네이밍 (클래스)
        - JPA 엔티티: 명사, 접미사 없음 (예: `Food`, `Refrigerator`)
        - Controller: `{Domain}Controller`
        - Swagger 문서: `{Domain}ControllerDocs`
        - Service: `{Domain}Service`
        - Facade: `{Domain}Facade`
        - Repository: `{Domain}Repository`
        - Request DTO: `{Action}{Domain}Request` (예: `FoodCreateRequest`)
        - Response DTO: `{Domain}Response` 또는 `{Domain}DetailResponse`
        - Command (내부 전달): 동사+명사 (예: `AddCategory`, `FoodCreateCommand`)
        - 이벤트: `{Domain}{Action}Event` (예: `RefrigeratorCreatedEvent`)
        - Validator: `{Domain}Validator`

    # ──────────────────────────────────────────
    # Controller 규칙
    # ──────────────────────────────────────────
    - path: "src/main/java/**/controller/**/*.java"
      instructions: |
        ## 아키텍처
        - Controller는 Service 또는 Facade만 호출한다. Repository 직접 주입/호출 금지.
        - Controller에 `@Transactional` 선언 금지.

        ## 보안
        - 인증된 회원 ID 주입은 `@LoginMember` 를 사용한다.
        - `@ValidateRefrigeratorAccess` 는 Controller가 아닌 Service 메서드에 선언한다.

        ## 메서드 네이밍
        - POST (생성): `append(...)`
        - GET 단건: `find(...)`
        - GET 목록: `findAll(...)`
        - PATCH (수정): `modify(...)`
        - DELETE (삭제): `remove(...)`

        ## 응답
        - 정상 응답은 `ApiResponse` 래퍼를 사용한다.
        - 생성 성공은 `HttpStatus.CREATED (201)` 을 반환한다.

    # ──────────────────────────────────────────
    # Service 규칙
    # ──────────────────────────────────────────
    - path: "src/main/java/**/service/**/*Service.java"
      instructions: |
        ## 아키텍처
        - Service는 자기 도메인 Repository + 필요 시 다른 도메인 Repository를 직접 주입할 수 있다.
        - 다른 도메인 Service를 직접 호출하는 것은 금지다 (크로스 도메인 상태 변경은 Facade가 담당).
        - Facade가 필요한 기준: 한 요청에서 2개 이상 도메인의 상태 변경이 발생할 때.
        - [마이그레이션 중] food/refrigerator/member/notification 도메인의 기존 Executor 클래스(*Finder, *Manager 등)는 마이그레이션 완료 전까지 수정은 허용하되, 새 Executor 클래스 추가는 금지한다.

        ## 트랜잭션
        - 쓰기 메서드: `@Transactional`
        - 조회 메서드: `@Transactional(readOnly = true)` 필수.
        - Controller에서 호출되는 모든 public 메서드에 `@Transactional` 또는 `@Transactional(readOnly = true)` 를 선언한다.

        ## 보안
        - 냉장고 접근 권한 검증: `@ValidateRefrigeratorAccess(key = "#key")` 를 메서드에 선언한다.
        - SpEL 표현식으로 `MemberRefrigeratorKey` 를 지정한다.

    # ──────────────────────────────────────────
    # Facade 규칙
    # ──────────────────────────────────────────
    - path: "src/main/java/**/service/**/*Facade.java"
      instructions: |
        ## 아키텍처
        - Facade는 Repository를 직접 주입하거나 호출하지 않는다.
        - 반드시 Service 메서드를 통해서만 데이터에 접근한다.
        - 2개 이상 도메인 Service의 상태 변경을 오케스트레이션할 때만 Facade를 생성한다.

        ## 트랜잭션
        - `@Transactional` 선언 가능. 하위 Service의 트랜잭션이 참여한다.

    # ──────────────────────────────────────────
    # Entity 규칙
    # ──────────────────────────────────────────
    - path: "src/main/java/**/entity/**/*.java"
      instructions: |
        ## 엔티티 설계
        - 모든 엔티티는 `BaseEntity` 를 상속해야 한다 (id, createdAt, modifiedAt, status 제공).
        - 생성은 정적 팩토리 메서드 `register()` 또는 `create()` 로만 허용. `@Builder` 는 `private` 또는 `package-private`.
        - `@AllArgsConstructor(access = AccessLevel.PRIVATE)`, `@NoArgsConstructor(access = AccessLevel.PROTECTED)` 를 사용한다.
        - Setter 사용 금지. 상태 변경은 `delete()`, `updateName()` 같은 명시적 도메인 메서드로만.
        - `@Getter` 를 클래스 레벨에 선언하고 개별 필드에 `@Setter` 는 절대 추가하지 않는다.

        ## 소프트 딜리트
        - 물리 삭제 금지. `entity.delete()` (BaseEntity 제공) 로 소프트 딜리트.
        - 조회 쿼리에 `EntityStatus.ACTIVE` 조건을 항상 명시한다.
        - 삭제 메서드는 멱등성을 보장: 이미 `DELETED` 상태이면 early return, 존재하지 않을 때만 `NOT_FOUND_DATA` 예외.

        ## 연관관계
        - 모든 `@ManyToOne`, `@OneToOne` 에 `fetch = FetchType.LAZY` 를 명시한다. EAGER 금지.
        - `@OneToMany` 는 양방향 설정을 최소화하고, 필요 시 `mappedBy` 와 `cascade` 를 명확히 지정한다.

        ## 값 객체 (@Embeddable)
        - `@NoArgsConstructor(access = AccessLevel.PROTECTED)` 를 사용한다.
        - 정적 팩토리 메서드 `register()` 로만 생성.

    # ──────────────────────────────────────────
    # Repository 규칙
    # ──────────────────────────────────────────
    - path: "src/main/java/**/repository/**/*.java"
      instructions: |
        ## 쿼리 작성
        - 단순 조건 조회는 Spring Data JPA 파생 쿼리(메서드명 쿼리) 를 사용한다.
        - 복잡한 조건 또는 fetch join 이 필요한 경우 `@Query` JPQL 을 사용한다.
        - 연관 엔티티를 함께 조회할 때는 반드시 `JOIN FETCH` 로 N+1 을 방지한다.
        - 동적 조건이 필요한 경우 `{Domain}RepositoryImpl` 에 QueryDSL 로 구현한다.

        ## 일관성
        - 조회 메서드의 반환 타입: 단건 → `Optional<T>`, 목록 → `List<T>`.
        - 페이징은 `Slice<T>` 를 반환한다 (커서 기반 페이징).
        - 벌크 수정/삭제 쿼리는 `@Modifying(clearAutomatically = true)` 를 사용한다.

    # ──────────────────────────────────────────
    # DTO 규칙
    # ──────────────────────────────────────────
    - path: "src/main/java/**/dto/**/*.java"
      instructions: |
        ## 공통
        - 모든 DTO는 불변 `record` 로 작성한다. class 사용 금지.

        ## Request DTO
        - Bean Validation 어노테이션으로 입력 검증을 선언한다 (`@NotBlank`, `@NotNull`, `@Positive` 등).
        - Request → Command 변환 메서드는 `toCommand()` 로 통일한다.

        ## Response DTO
        - Entity → Response 변환은 `Response.of(entity)` 정적 팩토리로 통일한다.
        - **Response DTO**에서 `from()` 메서드명은 사용하지 않는다. 반드시 `of()` 를 사용한다.
        - 목록 변환도 `of(List<Entity>)` 오버로드로 처리한다.
        - Command나 내부 전달용 DTO(예: `CachedCategories`, `MemberRefrigeratorKey`)는 `from()` / `of()` 제약 없이 편의 메서드를 허용한다.

        ## Command (내부 전달용)
        - 별도 검증 로직 없이 데이터만 운반한다.
        - `addCommand.toKey()` 처럼 관련 Key 객체 변환 메서드를 제공할 수 있다.

    # ──────────────────────────────────────────
    # 이벤트 리스너 규칙
    # ──────────────────────────────────────────
    - path: "src/main/java/**/event/**/*.java"
      instructions: |
        ## 이벤트 리스너
        - 후속/비동기 작업은 이벤트로 분리한다.
        - 이벤트 리스너는 `@TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)` 와
          `@Transactional(propagation = Propagation.REQUIRES_NEW)` 를 함께 선언한다.
        - 리스너 내부에서 발생하는 예외는 try-catch 로 격리하여 원본 트랜잭션에 영향을 주지 않는다.
        - 리스너가 단순 알림/로깅(DB 쓰기 없음) 만 하는 경우 `REQUIRES_NEW` 는 불필요하다.

    # ──────────────────────────────────────────
    # 테스트 규칙
    # ──────────────────────────────────────────
    - path: "src/test/java/**/*.java"
      instructions: |
        ## 테스트 메서드명
        - 반드시 한글로 작성한다.
        - 명사 나열이 아닌 문장으로: 행위와 결과까지 기술한다.
          - ❌ `카테고리_추가_테스트`
          - ✅ `동일한_냉장고에_중복된_이름의_카테고리를_추가하면_예외가_발생한다`
        - 도메인 정책·현상 중심으로 기술한다. 메서드 구현 관점 금지.

        ## 테스트 구조
        - BDD 기반: `// given`, `// when`, `// then` 주석으로 구분한다.
        - 예외 검증은 `// expected` 주석으로 구분한다.
        - 한 테스트에는 하나의 주제만 검증한다.
        - 각 테스트 간 독립성을 보장한다 (공유 가변 상태 금지).

        ## 테스트 계층
        - 통합 테스트: `IntegrationTestSupport` 상속 (실제 DB + 실제 객체, Service 유스케이스 검증).
        - Controller 테스트: `ControllerTestSupport` 상속 (요청 직렬화/역직렬화, HTTP 상태 코드 검증에만 한정).
        - E2E 테스트: `E2ETestSupport` 상속 (핵심 API 시나리오, 사용자 관점 블랙박스).

        ## Mock 사용 기준
        - S3, FCM 등 외부 서비스는 Fake 객체로 대체한다.
        - 내부 비즈니스 로직은 실제 객체를 사용한다. Mock 으로 대체 금지.
        - Service 내부 호출 순서 검증(`then(service).should(inOrder)...`) 은 작성하지 않는다.
        - 비즈니스 결과(DB 상태) 를 검증한다.

        ## Fixture
        - 테스트 데이터는 `FixtureMonkey` + `src/test/.../fixture/` 의 도메인별 Fixture 헬퍼를 사용한다.
        - `@BeforeEach` 공유 픽스처는 "해당 픽스처를 몰라도 각 테스트를 이해할 수 있을 때"만 허용한다.
        - 새 도메인 추가 시 Fixture 헬퍼를 반드시 작성한다.

    # ──────────────────────────────────────────
    # Controller 테스트 추가 제한
    # ──────────────────────────────────────────
    - path: "src/test/java/**/controller/**/*.java"
      instructions: |
        - Controller 테스트는 요청 직렬화/역직렬화, HTTP 상태 코드, 응답 포맷 검증에 한정한다.
        - 비즈니스 로직 검증은 통합 테스트에서 담당한다.
        - Service 호출 여부/순서 검증 (`then(service).should(...)`) 은 작성하지 않는다.

chat:
  auto_reply: true
